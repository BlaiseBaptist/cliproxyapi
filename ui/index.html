<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Model outputs</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body><header class="topbar"><div><p class="eyebrow">MODEL LIBRARY / READ ONLY</p><h1>Model outputs</h1><p class="subtitle">Prompts, responses and the details supplied by each provider</p></div><div class="top-actions"><label class="toggle"><input id="auto" type="checkbox" checked> Auto-refresh <span>60s</span></label><button id="refresh" type="button">Refresh</button></div></header>
<main><nav class="workspace" aria-label="Workspace"><button id="live" type="button">Model outputs</button><button id="archive" type="button">Conversation history</button></nav><section id="stats" class="stats" aria-label="Overview"></section><p id="coverage" class="hint" role="status"></p><section class="filter-panel" aria-labelledby="filter-title"><div class="section-heading"><div><h2 id="filter-title">Filters</h2><p>Refine the records in this view</p></div><button id="reset" type="button" class="subtle">Reset filters</button></div><form id="filters"></form></section>
<div class="explorer"><section class="list-panel" aria-labelledby="list-title"><div class="section-heading list-heading"><div><h2 id="list-title">Saved outputs</h2><p id="list-subtitle"></p></div></div><div id="notice" role="status" aria-live="polite"></div><div class="table-wrap"><table><thead id="columns"></thead><tbody id="list"></tbody></table></div><div class="paging"><span id="page"></span><div><button id="prev" type="button">Previous</button><button id="next" type="button">Next</button></div></div></section><aside id="detail" class="detail-panel" hidden aria-labelledby="detail-title"><div class="detail-head"><div><p class="eyebrow">INSPECTOR</p><h2 id="detail-title">Model response</h2></div><button id="close" type="button" aria-label="Close details">Close <span aria-hidden="true">×</span></button></div><div id="detail-content"></div></aside></div></main><footer>All original data is retained · This view shows model content</footer></body></html>
