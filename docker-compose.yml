services:
  cliproxyapi:
    image: eceasy/cli-proxy-api:latest
    container_name: cliproxyapi
    environment:
      - TZ=America/New_York
    volumes:
      - ./config.yaml:/CLIProxyAPI/config.yaml
      - ./auths:/root/.cli-proxy-api
      - ./logs:/CLIProxyAPI/logs
      # Pinned, patched panel (disable-auto-update-panel: true in config.yaml)
      - ./static/management.html:/CLIProxyAPI/static/management.html:ro
    restart: unless-stopped

  # Codex /v1/responses edge, exposed only on loopback.
  # Rewrites the local quota-cooldown 429 (model_cooldown) into the OpenAI
  # usage_limit_reached shape so Codex stops instead of retrying. 2026-11-01
  cliproxy-edge:
    image: python:3-alpine
    container_name: cliproxy-edge
    user: "1000:1000"
    command: sh -c 'umask 077; exec python -u /app/edge.py'
    environment:
      - TZ=America/New_York
      - UPSTREAM=http://cliproxyapi:8317
      - LISTEN=0.0.0.0:8319
    volumes:
      - ./edge:/app:ro
      - ./data:/data
    ports:
      - 127.0.0.1:8319:8319
      - 127.0.0.1:8317:8319
    restart: unless-stopped

  model-output-indexer:
    image: python:3-alpine
    user: "1000:1000"
    restart: unless-stopped
    command: sh -c 'umask 077; exec python3 /app/index_usage.py /data/requests.sqlite3'
    volumes:
      - ./ui:/app:ro
      - ./data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  agent-traffic-ui:
    image: python:3-alpine
    user: "1000:1000"
    restart: unless-stopped
    command: ["python3", "/app/app.py"]
    ports:
      - "127.0.0.1:8320:8320"
    volumes:
      - ./ui:/app:ro
      - ./data:/data
    environment:
      TRAFFIC_DB: /data/requests.sqlite3
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
